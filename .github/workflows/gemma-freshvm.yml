name: gemma-vm-noise-probe

# DIAGNOSTIC (NOT scored). Measures Gemma timing noise with the public
# local-iterate fixture to compare latest xlarge against macOS 26 xlarge fresh
# VMs without private R2 prompts or protected environments.
on:
  push:
    branches:
      - tenki-runner-v2
    paths:
      - ".github/workflows/gemma-freshvm.yml"
  workflow_dispatch:
    inputs:
      repeats:
        description: "timed decode repeats per VM"
        default: "8"

concurrency:
  group: gemma-vm-noise-probe-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  probe:
    name: "gemma public probe (${{ matrix.runner_label }} vm ${{ matrix.vm }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - vm: 1
            runner_label: tenki-macos-latest-xlarge
          - vm: 2
            runner_label: tenki-macos-latest-xlarge
          - vm: 3
            runner_label: tenki-macos-latest-xlarge
          - vm: 4
            runner_label: tenki-macos-26-xlarge
          - vm: 5
            runner_label: tenki-macos-26-xlarge
          - vm: 6
            runner_label: tenki-macos-26-xlarge
    runs-on: ${{ matrix.runner_label }}
    timeout-minutes: 90
    env:
      MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH: correctness_prompts/public_longcopy_gate_english_512_256.json
      MLXFAST_REFERENCE_MANIFEST_PATH: fixtures/reference_gemma_4_31b_4bit.sha256
      MLXFAST_REFERENCE_DIR: /Users/runner/.cache/huggingface/hub/models--mlx-community--gemma-4-31b-4bit/snapshots/main
      MLXFAST_TRUSTED_BENCHMARK_REF: ${{ github.ref }}
      REPEATS: ${{ inputs.repeats }}
      OUT_DIR: probe-out
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: Layr-Labs/mlxfast-challenge-dev
          ref: 40f9917e2908fca727e77d01a6b9b9f2cf7653d0
          persist-credentials: false

      - name: Host identity + VM freshness
        run: |
          set -uo pipefail
          boot=$(sysctl -n kern.boottime 2>/dev/null | grep -oE 'sec = [0-9]+' | grep -oE '[0-9]+' | head -1)
          now=$(date +%s)
          echo "source_repo=Layr-Labs/mlxfast-challenge-dev"
          echo "source_ref=$(git rev-parse HEAD 2>/dev/null || true)"
          echo "runner_label=${{ matrix.runner_label }}"
          echo "vm=${{ matrix.vm }} uptime_s=$(( now - ${boot:-now} )) (small => fresh VM)"
          sw_vers || true
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true
          sysctl -n hw.ncpu 2>/dev/null || true
          sysctl -n hw.memsize 2>/dev/null || true
          df -h

      - name: Check public correctness fixture
        run: |
          set -euo pipefail
          if [[ ! -f "${MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH}" ]]; then
            echo "::error::public correctness fixture missing at ${MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH}" >&2
            exit 1
          fi

      - name: Restore SwiftPM cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Swift harness and reference checkpoint
        env:
          MLXFAST_REFERENCE_MODEL_REPO: mlx-community/gemma-4-31b-4bit
          MLXFAST_SKIP_WEIGHTS_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          missing=0
          while read -r expected_hash expected_size relative_path extra; do
            [[ -z "${expected_hash:-}" || "${expected_hash}" == \#* ]] && continue
            file="${MLXFAST_REFERENCE_DIR}/${relative_path}"
            if [[ -n "${extra:-}" || -z "${expected_size:-}" || -z "${relative_path:-}" ]]; then
              echo "::error::malformed manifest line for ${relative_path:-unknown}" >&2
              exit 1
            fi
            if [[ ! -f "${file}" ]]; then
              echo "::error::baked Gemma checkpoint missing ${relative_path} at ${MLXFAST_REFERENCE_DIR}" >&2
              missing=1
              continue
            fi
            actual_size="$(wc -c < "${file}" | tr -d ' ')"
            if [[ "${actual_size}" != "${expected_size}" ]]; then
              echo "::error::baked Gemma checkpoint size mismatch for ${relative_path}: expected ${expected_size}, got ${actual_size}" >&2
              missing=1
            fi
          done < "${MLXFAST_REFERENCE_MANIFEST_PATH}"
          [[ "${missing}" == "0" ]]
          ./setup.sh

      - name: Transform reference checkpoint
        run: |
          set -euo pipefail
          mkdir -p weights
          MLXFAST_OFFLINE_WRITABLE_PATHS="${PWD}/weights" \
            .github/scripts/run-offline.sh .build/release/mlxfast-swift transform \
            --reference "${MLXFAST_REFERENCE_DIR}" --output weights

      - name: Repeated public local-iterate timing (within-VM jitter + warming)
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}"
          OUT="${OUT_DIR}/vm-${{ matrix.vm }}.jsonl"
          : > "${OUT}"
          n="${REPEATS:-8}"
          for i in $(seq 1 "${n}"); do
            sp="/tmp/mlxfast-probe-${{ github.run_id }}-${{ github.run_attempt }}/score-${i}.json"
            integ="/tmp/mlxfast-probe-${{ github.run_id }}-${{ github.run_attempt }}/integ-${i}.json"
            rm -f "$sp" "$integ"
            MLXFAST_SCORE_PATH="$sp" \
              MLXFAST_INTEGRITY_PATH="$integ" \
              MLXFAST_SKIP_TRANSFORM="1" \
              MLXFAST_WEIGHTS_PATH=weights \
              MLXFAST_NOTE="gemma-vm-noise-probe ${{ matrix.runner_label }} vm=${{ matrix.vm }} repeat=${i}" \
              ./benchmark.sh --local-iterate >/dev/null 2>&1 || true
            d=$(jq -r '.metrics.decode_seconds_per_token // empty' "$sp" 2>/dev/null || echo "")
            p=$(jq -r '.metrics.prefill_seconds_per_token // empty' "$sp" 2>/dev/null || echo "")
            echo "{\"vm\":${{ matrix.vm }},\"runner_label\":\"${{ matrix.runner_label }}\",\"i\":${i},\"prefill\":${p:-null},\"decode\":${d:-null}}" | tee -a "${OUT}"
          done
          echo "=== ${{ matrix.runner_label }} vm ${{ matrix.vm }} decode samples (s/token) ==="
          jq -r '.decode' "${OUT}" | tr '\n' ' '; echo
          echo "=== ${{ matrix.runner_label }} vm ${{ matrix.vm }} prefill samples (s/token) ==="
          jq -r '.prefill' "${OUT}" | tr '\n' ' '; echo

      - name: Upload probe results (timings only)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gemma-vm-noise-probe-${{ github.run_id }}-vm${{ matrix.vm }}-${{ matrix.runner_label }}
          path: probe-out/vm-${{ matrix.vm }}.jsonl
          if-no-files-found: error
          retention-days: 3

  summarize:
    name: summarize macOS 15 vs 26
    needs: [probe]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download probe artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        continue-on-error: true
        with:
          pattern: gemma-vm-noise-probe-${{ github.run_id }}-vm*
          path: probe-results
          merge-multiple: true

      - name: Summarize timing comparison
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          import os
          import pathlib
          import statistics

          root = pathlib.Path("probe-results")
          rows = []
          for path in sorted(root.glob("vm-*.jsonl")):
              for line in path.read_text().splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  label = row.get("runner_label", "")
                  row["family"] = "macOS 26" if "tenki-macos-26-" in label else "macOS 15 latest"
                  rows.append(row)

          def is_number(value):
              return isinstance(value, (int, float)) and math.isfinite(value)

          def median(values):
              return statistics.median(values) if values else None

          def fmt(value):
              return "n/a" if value is None else f"{value:.6f}"

          def family_rows(family):
              return [row for row in rows if row["family"] == family]

          def metric_values(items, key):
              return [row[key] for row in items if is_number(row.get(key))]

          def stats(items, key):
              values = metric_values(items, key)
              if not values:
                  return {"count": 0, "median": None, "min": None, "max": None}
              return {
                  "count": len(values),
                  "median": median(values),
                  "min": min(values),
                  "max": max(values),
              }

          families = ["macOS 15 latest", "macOS 26"]
          summary = {
              family: {
                  "rows": len(family_rows(family)),
                  "vms": sorted({row.get("vm") for row in family_rows(family)}),
                  "decode": stats(family_rows(family), "decode"),
                  "prefill": stats(family_rows(family), "prefill"),
              }
              for family in families
          }

          latest_decode = summary["macOS 15 latest"]["decode"]["median"]
          mac26_decode = summary["macOS 26"]["decode"]["median"]
          ratio = None
          delta = None
          if latest_decode and mac26_decode:
              ratio = mac26_decode / latest_decode
              delta = (ratio - 1.0) * 100.0

          out = []
          out.append("# Gemma Fresh VM Timing")
          out.append("")
          out.append(f"Run: `{os.environ.get('GITHUB_RUN_ID', '')}`")
          out.append("")
          out.append("Lower seconds/token is better.")
          out.append("")
          out.append("## OS Comparison")
          out.append("")
          out.append("| Group | VMs | Valid decode samples | Decode median | Decode min | Decode max | Prefill median |")
          out.append("| --- | ---: | ---: | ---: | ---: | ---: | ---: |")
          for family in families:
              item = summary[family]
              decode = item["decode"]
              prefill = item["prefill"]
              out.append(
                  f"| {family} | {len(item['vms'])} | {decode['count']} | "
                  f"{fmt(decode['median'])} | {fmt(decode['min'])} | {fmt(decode['max'])} | "
                  f"{fmt(prefill['median'])} |"
              )
          out.append("")
          if ratio is not None and delta is not None:
              winner = "macOS 26" if ratio < 1 else "macOS 15 latest"
              out.append(
                  f"Decode median ratio `macOS 26 / macOS 15 latest`: `{ratio:.4f}` "
                  f"({delta:+.2f}%). Faster group: **{winner}**."
              )
          else:
              out.append("Decode median ratio unavailable because one group has no valid decode samples.")
          out.append("")
          out.append("## Per-VM Medians")
          out.append("")
          out.append("| VM | Group | Valid samples | Decode median | Decode min | Decode max | Prefill median |")
          out.append("| ---: | --- | ---: | ---: | ---: | ---: | ---: |")
          for vm in sorted({row.get("vm") for row in rows if row.get("vm") is not None}):
              items = [row for row in rows if row.get("vm") == vm]
              label = items[0].get("family", "unknown") if items else "unknown"
              decode = stats(items, "decode")
              prefill = stats(items, "prefill")
              out.append(
                  f"| {vm} | {label} | {decode['count']} | {fmt(decode['median'])} | "
                  f"{fmt(decode['min'])} | {fmt(decode['max'])} | {fmt(prefill['median'])} |"
              )
          out.append("")
          out.append("## Raw Samples")
          out.append("")
          out.append("| VM | Group | Repeat | Decode | Prefill |")
          out.append("| ---: | --- | ---: | ---: | ---: |")
          for row in sorted(rows, key=lambda item: (item.get("vm", 0), item.get("i", 0))):
              out.append(
                  f"| {row.get('vm', '')} | {row.get('family', '')} | {row.get('i', '')} | "
                  f"{fmt(row.get('decode'))} | {fmt(row.get('prefill'))} |"
              )

          if not rows:
              out = [
                  "# Gemma Fresh VM Timing",
                  "",
                  "No probe artifacts were available for this run.",
              ]

          markdown = "\n".join(out) + "\n"
          pathlib.Path("gemma-summary.md").write_text(markdown)
          pathlib.Path("gemma-summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(markdown)
          PY

      - name: Upload summary artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gemma-vm-noise-probe-${{ github.run_id }}-summary
          path: |
            gemma-summary.md
            gemma-summary.json
          if-no-files-found: error
          retention-days: 14
